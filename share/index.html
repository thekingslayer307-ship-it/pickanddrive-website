<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pick&amp;Drive — Live Trip</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /*
   * This page matches the app's dark navy/lime theme, not the marketing
   * site's cream one — whoever opens it followed a link out of a live trip,
   * not out of an ad. It should feel like a window into the same app, not a
   * different product.
   */
  :root{
    --limestone:#0A0F1A; --paper:#151E2C; --line:#26334A;
    --ink:#F2F5F9; --ink-soft:#AEBACA; --muted:#75839A;
    --petrol:#D8E831; --mint-deep:#C3D41D; --coral:#F0554A; --sky:#14283A;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--limestone); color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #map{height:52vh;min-height:280px;width:100%;background:#0B1A33}
  #map::after{content:'';position:absolute;inset:0;z-index:450;pointer-events:none;background:#2A5CD9;mix-blend-mode:color;opacity:.6}
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.75)}
  .leaflet-control-attribution{font-size:9px;background:rgba(10,15,26,.7);color:#8C99AC}
  .leaflet-control-attribution a{color:#A9B6C8}
  .pin{border:3px solid var(--limestone);border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.6)}
  .pin-pickup{background:var(--mint-deep)}
  .pin-drop{background:var(--coral);border-radius:4px}
  .car{width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--petrol);
       box-shadow:0 3px 12px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:var(--petrol)}

  .sheet{margin-top:-18px;position:relative;z-index:10;border-top-left-radius:24px;border-top-right-radius:24px;background:var(--limestone);padding:22px 20px 40px;max-width:560px;margin-left:auto;margin-right:auto}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}
  .brand .mark{width:26px;height:26px;border-radius:9px;background:var(--petrol);display:flex;align-items:center;justify-content:center}
  .brand .mark svg{width:14px;height:14px}
  .brand b{font-size:16px;font-weight:800}

  .status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mint-deep)}
  .status.ended{color:var(--muted)}
  .status .dot{width:7px;height:7px;border-radius:4px;background:currentColor}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  .row{display:flex;align-items:flex-start;gap:11px;padding:9px 0}
  .row + .row{border-top:1px solid var(--line)}
  .row .dot{width:9px;height:9px;border-radius:4.5px;margin-top:5px;flex:0 0 auto}
  .row .dot.pickup{background:var(--mint-deep)}
  .row .dot.drop{background:var(--coral);border-radius:2px}
  .row .label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .row .value{font-size:14px;font-weight:700}

  .driver{display:flex;align-items:center;gap:12px}
  .driver .avatar{width:44px;height:44px;border-radius:14px;background:var(--sky);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .driver .name{font-size:14px;font-weight:700}
  .driver .vehicle{font-size:11px;color:var(--muted);margin-top:2px}

  .note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}
  .empty{padding:60px 24px;text-align:center}
  .empty h1{font-size:19px;margin:0 0 8px}
  .empty p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
</style>
</head>
<body>

<div id="map"></div>
<div class="sheet" id="sheet">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0A0F1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2-8-8-2Z"/></svg></div>
    <b>Pick&amp;Drive</b>
  </div>
  <div id="content">
    <div class="empty"><h1>Loading trip…</h1><p>One moment.</p></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var API = 'https://api.pickanddrive.pk/api/v1';
  var token = new URLSearchParams(location.search).get('t');
  var contentEl = document.getElementById('content');
  var sheetEl = document.getElementById('sheet');
  var pollTimer = null;

  var LIVE_STATUSES = ['dispatched', 'accepted', 'arriving', 'arrived', 'in_progress'];
  var STATUS_LABEL = {
    pending_dispatch: 'Finding a captain', dispatched: 'Captain assigned', accepted: 'Captain on the way',
    arriving: 'Captain arriving', arrived: 'Captain has arrived', in_progress: 'Trip in progress',
    completed: 'Trip completed', rated: 'Trip completed', cancelled: 'Trip cancelled',
  };

  function showEmpty(title, body) {
    document.getElementById('map').style.display = 'none';
    contentEl.innerHTML = '<div class="empty"><h1>' + title + '</h1><p>' + body + '</p></div>';
  }

  if (!token) {
    showEmpty('No trip to show', 'This page needs a trip link — open the one shared with you instead of this page directly.');
    return;
  }

  // ---- map (built once; markers moved on each poll rather than rebuilt, the
  // same reasoning as the app's own map — refetching tiles every 5s would be
  // both wasteful and visibly janky). ----
  var map = L.map('map', { zoomControl: false, attributionControl: true, scrollWheelZoom: false })
    .setView([31.5204, 74.3587], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  function icon(cls, size) {
    return L.divIcon({ className: '', html: '<div class="' + cls + '" style="width:' + size + 'px;height:' + size + 'px"></div>', iconSize: [size, size] });
  }
  var markers = { pickup: null, drop: null, driver: null };
  var carSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>';

  function place(data) {
    var bounds = [];
    if (data.pickup) {
      if (markers.pickup) markers.pickup.setLatLng([data.pickup.lat, data.pickup.lng]);
      else markers.pickup = L.marker([data.pickup.lat, data.pickup.lng], { icon: icon('pin pin-pickup', 16) }).addTo(map);
      bounds.push([data.pickup.lat, data.pickup.lng]);
    }
    if (data.dropoff) {
      if (markers.drop) markers.drop.setLatLng([data.dropoff.lat, data.dropoff.lng]);
      else markers.drop = L.marker([data.dropoff.lat, data.dropoff.lng], { icon: icon('pin pin-drop', 16) }).addTo(map);
      bounds.push([data.dropoff.lat, data.dropoff.lng]);
    }
    if (data.driver_position) {
      if (markers.driver) markers.driver.setLatLng([data.driver_position.lat, data.driver_position.lng]);
      else markers.driver = L.marker([data.driver_position.lat, data.driver_position.lng], {
        icon: L.divIcon({ className: '', html: '<div class="car">' + carSvg + '</div>', iconSize: [32, 32] }),
      }).addTo(map);
      bounds.push([data.driver_position.lat, data.driver_position.lng]);
    } else if (markers.driver) {
      map.removeLayer(markers.driver);
      markers.driver = null;
    }
    if (bounds.length > 1) map.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
    else if (bounds.length === 1) map.setView(bounds[0], 14);
  }

  function render(data) {
    var live = LIVE_STATUSES.indexOf(data.status) !== -1;
    var vehicleLine = data.vehicle ? '<div class="vehicle">' + data.vehicle + '</div>' : '';
    var driverBlock = data.driver_name
      ? '<div class="card driver"><div class="avatar">' + (data.driver_name.trim().charAt(0) || '?').toUpperCase() + '</div><div><div class="name">' + data.driver_name + '</div>' + vehicleLine + '</div></div>'
      : '';

    contentEl.innerHTML =
      '<span class="status' + (live ? '' : ' ended') + '"><span class="dot"></span>' + (STATUS_LABEL[data.status] || data.status) + '</span>' +
      driverBlock +
      '<div class="card">' +
        '<div class="row"><div class="dot pickup"></div><div><div class="label">Pickup</div><div class="value">' + data.pickup_address + '</div></div></div>' +
        '<div class="row"><div class="dot drop"></div><div><div class="label">Drop-off</div><div class="value">' + data.drop_address + '</div></div></div>' +
      '</div>' +
      '<p class="note">' + (live ? 'This page updates automatically while the trip is moving.' : 'This trip has ended — the map above is the route that was taken.') + '</p>';

    place(data);

    if (!live && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function poll() {
    fetch(API + '/share/' + encodeURIComponent(token))
      .then(function (res) {
        if (res.status === 404) { throw new Error('gone'); }
        if (!res.ok) throw new Error('failed');
        return res.json();
      })
      .then(render)
      .catch(function (e) {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        showEmpty('This trip link is no longer valid', 'It may have expired, or the trip may not exist.');
      });
  }

  poll();
  pollTimer = setInterval(poll, 5000);
})();
</script>
</body>
</html>
